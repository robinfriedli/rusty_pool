[package]
name = "rusty_pool"
version = "1.0.0"
authors = ["robinfriedli <robinfriedli@icloud.com>"]
edition = "2024"
license = "Apache-2.0"
description = "Self-growing and shrinking Thread Pool implementation based on crossbeam's multi-producer, multi-consumer channels. Provides non-blocking task execution, awaitable task results, and async support."
repository = "https://github.com/robinfriedli/rusty_pool"
homepage = "https://github.com/robinfriedli/rusty_pool"
readme = "README.md"
keywords = ["concurrency", "thread", "threadpool", "async", "futures"]
categories = ["asynchronous", "concurrency"]

[features]
default = ["async"]
async = ["futures"]

[dependencies]
crossbeam-channel = "0.5.17"
futures-channel = "0.3.34"
futures-executor = "0.3.34"
num_cpus = "1.17.0"

[dependencies.futures]
version = "0.3.34"
optional = true
